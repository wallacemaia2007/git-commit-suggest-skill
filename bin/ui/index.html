<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-commit-suggest</title>
<style>
:root{--bg:#212121;--card:#2f2f2f;--border:rgba(255,255,255,.08);--text:#ececec;--muted:#b4b4b4;--accent:#10a37f;--accent-hover:#19bf96;--error:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:0 auto;padding:32px 18px 48px}h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 16px}p{color:var(--muted);line-height:1.5}.version{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:18px}.field{margin:16px 0}.field label{display:block;font-weight:600;margin-bottom:6px}.description{color:var(--muted);font-size:13px;margin:0 0 8px}.control,button{font:inherit;border-radius:6px}.control{width:100%;padding:10px;background:#212121;color:var(--text);border:1px solid #555}.control:focus,button:focus{outline:2px solid var(--accent-hover);outline-offset:2px}.toggle{display:flex;align-items:center;gap:10px}.toggle input{width:18px;height:18px;accent-color:var(--accent)}.dest{display:block;margin:10px 0;color:var(--text)}.dest input{margin-right:8px;accent-color:var(--accent)}.preview{white-space:pre-wrap;background:#202020;border-radius:6px;padding:14px;color:var(--text);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.error{color:var(--error);min-height:20px}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}button{padding:10px 16px;border:1px solid #666;background:transparent;color:var(--text);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);font-weight:600}button.primary:hover{background:var(--accent-hover)}button:hover{border-color:var(--muted)}.success{text-align:center}.success strong{color:var(--accent-hover)}@media(max-width:420px){main{padding:22px 12px}.card{padding:16px}.actions button{flex:1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main id="app"><header><h1>git-commit-suggest</h1><div class="version" id="version"></div><p id="intro"></p></header><div id="content"></div></main>
<script>
const token=new URLSearchParams(location.search).get("token"), headers={"X-Token":token}, state={}; let options=[];
const i18n={pt:{intro:"Configure a skill e instale-a onde preferir.",configIntro:"Ajuste a configuração da skill.",save:"Salvar",defaults:"Restaurar padrões",cancel:"Cancelar",locations:"Onde instalar",saveLocations:"Onde salvar",preview:"Pré-visualização",success:"Configuração salva",close:"Você pode fechar esta aba",required:"Escolha pelo menos um destino.",invalid:"Valores inválidos: "},en:{intro:"Configure the skill and install it where you prefer.",configIntro:"Adjust the skill configuration.",save:"Save",defaults:"Restore defaults",cancel:"Cancel",locations:"Where to install",saveLocations:"Where to save",preview:"Live preview",success:"Configuration saved",close:"You can close this tab",required:"Choose at least one destination.",invalid:"Invalid values: "}};
const lang=(navigator.language||"en").toLowerCase().startsWith("pt")?"pt":"en", t=i18n[lang];
async function get(path){const r=await fetch(path,{headers});if(!r.ok)throw Error(await r.text());return r.json()}
function set(obj,key,value){const p=key.split(".");let x=obj;for(let i=0;i<p.length-1;i++)x=x[p[i]]??={};x[p.at(-1)]=value}
function getv(obj,key){return key.split(".").reduce((x,k)=>x?.[k],obj)}
function render(){const c=document.getElementById("content");c.innerHTML="";if(state.mode==="install"||state.mode==="config"){const card=document.createElement("section");card.className="card";card.innerHTML=`<h2>${state.mode==="install"?t.locations:t.saveLocations}</h2><div id="destinations"></div>`;c.append(card);const d=card.querySelector("#destinations");state.destinations.forEach(x=>{const label=document.createElement("label");label.className="dest";label.innerHTML=`<input type="checkbox" data-dest="${x.id}" ${(x.selected??x.exists)?"checked":""}>${x.label}${x.exists?"":" (novo)"}`;d.append(label)})}
const groups=[...new Set(options.map(o=>o.group))];groups.forEach(group=>{const card=document.createElement("section");card.className="card";card.innerHTML=`<h2>${group}</h2>`;options.filter(o=>o.group===group).forEach(o=>{const f=document.createElement("div");f.className="field";const id="field-"+o.key.replace(".","-");f.innerHTML=`<label for="${id}">${o.label}</label><p class="description">${o.description}</p>`;let control;if(o.type==="select"){control=document.createElement("select");o.choices.forEach(v=>{const opt=document.createElement("option");opt.value=v;opt.textContent=v;control.append(opt)})}else if(o.type==="number"){control=document.createElement("input");control.type="number";control.min=o.min;control.max=o.max}else if(o.type==="confirm"){control=document.createElement("input");control.type="checkbox";const wrap=document.createElement("div");wrap.className="toggle";wrap.append(control);f.append(wrap);control.id=id;control.checked=!!getv(state.config,o.key);control.onchange=update;card.append(f);return}else{control=document.createElement("input");control.type="text"}control.className="control";control.id=id;control.value=getv(state.config,o.key);control.oninput=update;f.append(control);card.append(f)})});const preview=document.createElement("section");preview.className="card";preview.innerHTML=`<h2>${t.preview}</h2><div class="preview" id="preview"></div>`;c.append(preview);const actions=document.createElement("div");actions.className="actions";actions.innerHTML=`<button id="defaults">${t.defaults}</button><button id="cancel">${t.cancel}</button><button class="primary" id="save">${t.save}</button><div class="error" id="error" role="alert"></div>`;c.append(actions);document.getElementById("defaults").onclick=()=>{state.config=structuredClone(state.defaults);render()};document.getElementById("cancel").onclick=()=>post("/api/cancel",{});document.getElementById("save").onclick=save;update()}
function update(){options.forEach(o=>{const el=document.getElementById("field-"+o.key.replace(".","-"));if(el)set(state.config,o.key,o.type==="confirm"?el.checked:o.type==="number"?Number(el.value):el.value)});const min=Math.max(1,Number(state.config.detailCount?.min)||2),max=Math.max(min,Number(state.config.detailCount?.max)||4),n=Math.min(max,min),sep=state.config.bodySeparator==="dash"?"\n-\n":"\n\n",words={en:["add mobile navigation","Implement hamburger toggle","Adjust responsive layout","Document keyboard shortcut"],pt:["adiciona navegação mobile","Implementa botão do menu","Ajusta o layout responsivo","Documenta atalho de teclado"],es:["añade navegación móvil","Implementa el botón del menú","Ajusta el diseño responsive","Documenta el atajo de teclado"],fr:["ajoute la navigation mobile","Implémente le bouton du menu","Ajuste la mise en page responsive","Documente le raccourci clavier"],it:["aggiunge la navigazione mobile","Implementa il pulsante del menu","Regola il layout responsive","Documenta la scorciatoia da tastiera"],de:["ergänzt die mobile Navigation","Implementiert den Menüschalter","Passt das responsive Layout an","Dokumentiert die Tastenkombination"]};const w=words[String(state.config.language||"en").split("-")[0]]||words.en;document.getElementById("preview").textContent=`feat(ui): ${w[0]}${sep}${w.slice(1,1+n).map(x=>"- "+x).join("\n")}`}
async function post(path,body){const r=await fetch(path,{method:"POST",headers:{"X-Token":token,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
async function save(){let selected=[...document.querySelectorAll("[data-dest]:checked")].map(x=>state.destinations.find(d=>d.id===x.dataset.dest)).filter(Boolean);if(state.mode==="config"&&!selected.length)selected=state.destinations.filter(d=>d.selected);if(!selected.length){document.getElementById("error").textContent=t.required;return}try{const result=await post("/api/save",{config:state.config,destinations:selected});document.getElementById("app").innerHTML=`<div class="card success"><h1>${t.success}</h1><p>${t.close}</p><p>${result.paths.map(x=>`<strong>${x}</strong>`).join("<br>")}</p></div>`}catch(e){let message=e.message;try{const data=JSON.parse(message);if(Array.isArray(data.errors))message=t.invalid+data.errors.map(x=>x.key).join(", ")}catch{}document.getElementById("error").textContent=message}}
(async()=>{try{[options,state.data]=await Promise.all([get("/api/options"),get("/api/state")]);Object.assign(state,state.data);state.defaults=structuredClone(state.data.defaults||state.config);document.getElementById("version").textContent="v"+state.version;document.getElementById("intro").textContent=state.mode==="install"?t.intro:t.configIntro;render()}catch(e){document.getElementById("app").innerHTML=`<div class="card error">${e.message}</div>`}})();
</script></body></html>
