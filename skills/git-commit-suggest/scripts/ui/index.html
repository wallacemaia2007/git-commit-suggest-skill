<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git Commit Suggest · Configuração</title>
<style>
:root{color-scheme:dark;--bg:#212121;--card:#2f2f2f;--border:rgba(255,255,255,.08);--text:#ececec;--muted:#b4b4b4;--accent:#10a37f;--error:#ef4444;--focus:#75d9bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(100% - 32px,720px);margin:40px auto 72px}h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.15;margin:0 0 8px}.intro,.description,.success p{color:var(--muted)}.group{margin:24px 0}.group h2{font-size:1.1rem;margin:0 0 12px}.field,.preview{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:10px 0}.field label{font-weight:600;display:block}.description{font-size:.9rem;margin:4px 0 12px}.field select,.field input[type=number],.field input[type=text]{display:block;width:100%;max-width:360px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}.toggle{display:flex!important;gap:12px;align-items:center}.toggle input{width:20px;height:20px;accent-color:var(--accent)}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.preview pre{white-space:pre-wrap;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;margin:10px 0 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.actions button{border:1px solid var(--border);border-radius:8px;padding:10px 16px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}.actions .save{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}.error{color:var(--error);min-height:1.5em}.success{padding:24px;border:1px solid var(--border);background:var(--card);border-radius:14px}.path{overflow-wrap:anywhere;color:var(--text)}[hidden]{display:none!important}@media(max-width:420px){.wrap{width:min(100% - 24px,720px);margin-top:24px}.field,.preview{padding:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><main class="wrap"><section id="formView"><form id="configForm"><h1 data-i="title">Configuração da skill</h1><p class="intro" data-i="intro">Personalize o formato das sugestões de commit. As alterações são salvas ao lado desta skill.</p><div id="controls" aria-live="polite"></div><section class="preview"><strong data-i="preview">Pré-visualização</strong><pre id="sample"></pre></section><p id="error" class="error" role="alert"></p><div class="actions"><button class="save" id="save" type="submit" data-i="save">Salvar</button><button id="defaults" type="button" data-i="defaults">Restaurar padrões</button><button id="cancel" type="button" data-i="cancel">Cancelar</button></div></form></section><section id="success" class="success" hidden><h1 data-i="saved">Configuração salva</h1><p data-i="savedHint">Você pode fechar esta aba.</p><p class="path" id="savedPath"></p></section></main>
<script>
const translations={pt:{title:"Configuração da skill",intro:"Personalize o formato das sugestões de commit. As alterações são salvas ao lado desta skill.",preview:"Pré-visualização",save:"Salvar",saving:"Salvando…",defaults:"Restaurar padrões",cancel:"Cancelar",saved:"Configuração salva",savedHint:"Você pode fechar esta aba.",required:"Revise os campos destacados.",invalid:"Valor inválido. Confira os limites indicados.",cancelled:"Configuração cancelada.",language:"Idioma",bodySeparator:"Separador do corpo",blank:"Linha em branco",dash:"Linha com hífen"},en:{title:"Skill settings",intro:"Customize commit suggestions. Changes are saved next to this skill.",preview:"Live preview",save:"Save",saving:"Saving…",defaults:"Restore defaults",cancel:"Cancel",saved:"Settings saved",savedHint:"You can close this tab.",required:"Please review the highlighted fields.",invalid:"Invalid value. Check the indicated limits.",cancelled:"Configuration cancelled.",language:"Language",bodySeparator:"Body separator",blank:"Blank line",dash:"Dash line"}};
const englishOptions={"language":["General","Language","Language used for the subject and details."],"maxSubjectLength":["Format","Maximum subject length","Character limit for the first line."],"detailCount.min":["Format","Minimum details","Minimum number of bullet points."],"detailCount.max":["Format","Maximum details","Maximum number of bullet points."],"bodySeparator":["Format","Body separator","Separator between the subject and details."],"scope.allow":["Style","Allow scope","Allow a scope in the subject."],"scope.autoDetect":["Style","Detect scope automatically","Infer scope from changed files."],"imperativeMood":["Style","Use imperative mood","Prefer imperative verbs when possible."]};
const lang=navigator.language?.toLowerCase().startsWith("pt")?"pt":"en",t=translations[lang],token=new URLSearchParams(location.search).get("token");let state,options=[];
document.documentElement.lang=lang==="pt"?"pt-BR":"en";document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t[el.dataset.i]);
async function api(path,method="GET",body){const response=await fetch(path,{method,headers:{"X-Token":token,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});if(!response.ok)throw new Error(await response.text());return response.json()}
function get(obj,key){return key.split(".").reduce((x,k)=>x?.[k],obj)}function set(obj,key,val){const parts=key.split(".");let cur=obj;for(const part of parts.slice(0,-1))cur=cur[part]??={};cur[parts.at(-1)]=val}
function render(){const host=document.querySelector("#controls");host.replaceChildren();const groups=new Map();for(const option of options){const english=lang==="en"?englishOptions[option.key]:null,group=english?.[0]||option.group;if(!groups.has(group)){const section=document.createElement("section");section.className="group";const heading=document.createElement("h2");heading.textContent=group;section.append(heading);groups.set(group,section);host.append(section)}const field=document.createElement("div");field.className="field";const id=`field-${option.key.replaceAll(".","-")}`,label=document.createElement("label");label.htmlFor=id;label.textContent=option.key==="language"?t.language:option.key==="bodySeparator"?t.bodySeparator:english?.[1]||option.label;field.append(label);const description=document.createElement("p");description.className="description";description.textContent=english?.[2]||option.description;field.append(description);let input;if(option.type==="select"){input=document.createElement("select");for(const choice of option.choices){const item=document.createElement("option");item.value=choice;item.textContent=choice==="blank"?t.blank:choice==="dash"?t.dash:choice;input.append(item)}}else if(option.type==="confirm"){label.className="toggle";input=document.createElement("input");input.type="checkbox";label.prepend(input);description.remove()}else{input=document.createElement("input");input.type=option.type==="number"?"number":"text";if(option.min!==undefined){input.min=option.min;input.max=option.max}}input.id=id;input.dataset.key=option.key;input.value=String(get(state.config,option.key));if(input.type==="checkbox")input.checked=Boolean(get(state.config,option.key));input.addEventListener("input",update);input.addEventListener("change",update);if(option.type!=="confirm")field.append(input);groups.get(group).append(field)}update()}
function update(){let invalid=false;for(const input of document.querySelectorAll("[data-key]")){const option=options.find(x=>x.key===input.dataset.key);let value=input.type==="checkbox"?input.checked:input.type==="number"?Number(input.value):input.value;if(input.value===""&&input.type==="number"){input.setCustomValidity(t.invalid);invalid=true;continue}input.setCustomValidity("");if(input.type==="number"&&(value<option.min||value>option.max)){input.setCustomValidity(t.invalid);invalid=true}set(state.config,option.key,value)}const min=get(state.config,"detailCount.min"),max=get(state.config,"detailCount.max");document.querySelector("#error").textContent=invalid?t.invalid:min>max?t.required:"";const samples={en:["feat(ui): improve settings panel","Add clear controls for common preferences","Keep the preview in sync with edits","Document configuration defaults"],"pt-BR":["feat(ui): melhora painel de configurações","Adiciona controles claros para preferências","Mantém a prévia atualizada com as alterações","Documenta os valores padrão"],es:["feat(ui): mejora el panel de configuración","Añade controles claros para preferencias","Mantiene la vista previa actualizada"],fr:["feat(ui): améliore le panneau de configuration","Ajoute des contrôles clairs pour les préférences","Garde l’aperçu synchronisé"],it:["feat(ui): migliora il pannello delle impostazioni","Aggiunge controlli chiari per le preferenze","Mantiene l’anteprima aggiornata"],de:["feat(ui): verbessert die Einstellungsansicht","Ergänzt klare Steuerelemente für Einstellungen","Hält die Vorschau aktuell"]};const language=get(state.config,"language"),sample=samples[language]||samples.en,count=Math.max(1,Math.min(10,get(state.config,"detailCount.min")||2)),separator=get(state.config,"bodySeparator")==="dash"?"\n\n-\n":"\n\n";document.querySelector("#sample").textContent=`${sample[0]}${separator}${sample.slice(1,1+count).map(line=>`- ${line}`).join("\n")}`}
document.querySelector("#defaults").addEventListener("click",()=>{state.config=structuredClone(state.defaults);render()});document.querySelector("#configForm").addEventListener("submit",async event=>{event.preventDefault();update();document.querySelector("#error").textContent="";if(document.querySelector("[data-key]:invalid")||get(state.config,"detailCount.min")>get(state.config,"detailCount.max")){document.querySelector("#error").textContent=t.required;return}const save=document.querySelector("#save");save.disabled=true;save.textContent=t.saving;try{const result=await api("/api/save","POST",{config:state.config});document.querySelector("#formView").hidden=true;document.querySelector("#success").hidden=false;document.querySelector("#savedPath").textContent=result.path}catch(error){let message=error.message||t.invalid;try{const response=JSON.parse(message);if(response.errors?.length)message=`${t.invalid} (${response.errors.map(item=>`${item.key}: ${JSON.stringify(item.value)}`).join(", ")})`}catch{}document.querySelector("#error").textContent=message;save.disabled=false;save.textContent=t.save}});document.querySelector("#cancel").addEventListener("click",async()=>{try{await api("/api/cancel","POST",{});document.querySelector("#formView").hidden=true;document.querySelector("#success").hidden=false;document.querySelector("#success h1").textContent=t.cancelled;document.querySelector("#savedPath").textContent=""}catch(error){document.querySelector("#error").textContent=error.message}});
(async()=>{try{[options,state]=await Promise.all([api("/api/options"),api("/api/state")]);render()}catch(error){document.querySelector("#error").textContent=error.message}})();
</script></body></html>
